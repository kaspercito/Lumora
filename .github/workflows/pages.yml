name: Página de enlaces (opcional)

# Publica docs-site/ en GitHub Pages: sirve para los enlaces "compartir" que abren la app.
# Activa: Settings > Pages > Source = "GitHub Actions".
on:
  push:
    branches: [ main ]
    paths: [ 'docs-site/**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
