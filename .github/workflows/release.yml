name: Publicar nueva versión de Lumora

# Cada vez que subas a la rama main un cambio de "versionName" en
# gradle/libs.versions.toml, este workflow compila el APK firmado y crea un
# Release en GitHub. La app de tus familiares lo detecta y les ofrece actualizar.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs-site/**'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.ver.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión
        id: ver
        run: |
          VER=$(grep -E '^versionName' gradle/libs.versions.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La versión v$VER ya fue publicada. Sube versionName para publicar otra."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.ver.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar llave de firma
        if: steps.ver.outputs.exists == 'false'
        run: |
          if [ -z "${{ secrets.LUMORA_KEYSTORE_BASE64 }}" ]; then
            echo "::error::Falta el secreto LUMORA_KEYSTORE_BASE64. Sigue la guía (paso de la llave de firma)."
            exit 1
          fi
          echo "${{ secrets.LUMORA_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/lumora.jks"
          echo "LUMORA_KEYSTORE_PATH=$RUNNER_TEMP/lumora.jks" >> "$GITHUB_ENV"

      - name: Setup Gradle
        if: steps.ver.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK firmado
        if: steps.ver.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease
        env:
          LUMORA_KEYSTORE_PASSWORD: ${{ secrets.LUMORA_KEYSTORE_PASSWORD }}
          LUMORA_KEY_ALIAS: ${{ secrets.LUMORA_KEY_ALIAS }}
          LUMORA_KEY_PASSWORD: ${{ secrets.LUMORA_KEY_PASSWORD }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
          MAL_KEY: ${{ secrets.MAL_KEY }}
          ANILIST_KEY: ${{ secrets.ANILIST_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          MDL_API_KEY: ${{ secrets.MDL_API_KEY }}

      # El actualizador compara el nombre del APK con versionName,
      # por eso el archivo debe llamarse exactamente "1.0.1.apk", "1.0.2.apk"...
      - name: Renombrar APK
        if: steps.ver.outputs.exists == 'false'
        run: |
          APK=$(ls app/build/outputs/apk/stable/release/*.apk | head -1)
          cp "$APK" "${{ steps.ver.outputs.version }}.apk"

      - name: Crear Release
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Lumora ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.ver.outputs.version }}.apk

  # Windows: se ejecuta DESPUES de crear el Release (needs: build), asi el APK queda siempre
  # como primer archivo y el actualizador de Android (que toma assets[0]) no se rompe.
  windows:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar instalador MSI
        shell: bash
        run: ./gradlew :desktopApp:packageMsi

      - name: Subir MSI al Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSI=$(ls desktopApp/build/compose/binaries/main/msi/*.msi | head -1)
          cp "$MSI" "Lumora-${{ needs.build.outputs.version }}-windows.msi"
          gh release upload "v${{ needs.build.outputs.version }}" "Lumora-${{ needs.build.outputs.version }}-windows.msi" --clobber --repo "${{ github.repository }}"
